name: iOS checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available -j > /tmp/simulators.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('/tmp/simulators.json') as source:
              devices = json.load(source)['devices']
          phone = next(device for runtime in devices.values() for device in runtime if device['name'].startswith('iPhone'))
          print('id=' + phone['udid'])
          PY
      - name: Build and test UIKit app
        run: >-
          xcodebuild test
          -project ios/ProductCatalogue.xcodeproj
          -scheme ProductCatalogue
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -parallel-testing-enabled NO
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Preserve Xcode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: warn
